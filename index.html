<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EDF0F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0F18" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NSA POS 2026">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232540D9'/%3E%3Cpath d='M9 8h14v16l-3.5-2-3.5 2-3.5-2L9 24z' fill='white'/%3E%3C/svg%3E">
<title>NSA POS 2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@500;600;700;800&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: sticky chrome (shop, day status, drawer cash, tabs). Sell = photo grid + order rail; the rail becomes a bottom sheet on phones. Green = cash, purple = PayNow, blue = actions. */
:root{
  --bg:#EDF0F6; --surface:#FFFFFF; --surface-2:#F5F7FB; --ink:#0F1729; --muted:#566074; --line:#D7DDE9;
  --accent:#2540D9; --accent-ink:#FFFFFF; --accent-soft:#E3E8FF;
  --cash:#127A47; --cash-soft:#DCF2E7;
  --paynow:#7B2B94; --paynow-soft:#F2E3F8;
  --warn:#9A4B05; --warn-soft:#FCEBCB;
  --bad:#BF2530; --bad-soft:#FCE1E3;
  --paper:#FBFBF7; --paper-ink:#1C1C1A; --paper-line:#B7B7AE;
  --ph-s:36%; --ph-l:87%; --ph-ink:30%;
  --shadow:0 1px 2px rgba(15,23,41,.06),0 8px 24px rgba(15,23,41,.08);
  --scrim:rgba(10,14,24,.5);
  --font-ui:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:'DM Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --chrome-h:120px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B0F18; --surface:#141A26; --surface-2:#1A2130; --ink:#E8ECF5; --muted:#99A3B7; --line:#273045;
    --accent:#8CA0FF; --accent-ink:#0B0F18; --accent-soft:#222B55;
    --cash:#52CF8F; --cash-soft:#12301F;
    --paynow:#D493EB; --paynow-soft:#34193F;
    --warn:#F2B35E; --warn-soft:#3B2A0D;
    --bad:#FF8087; --bad-soft:#40181C;
    --paper:#FBFBF7; --paper-ink:#1C1C1A; --paper-line:#B7B7AE;
    --ph-s:22%; --ph-l:26%; --ph-ink:78%;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.45);
    --scrim:rgba(0,0,0,.62);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0F18; --surface:#141A26; --surface-2:#1A2130; --ink:#E8ECF5; --muted:#99A3B7; --line:#273045;
  --accent:#8CA0FF; --accent-ink:#0B0F18; --accent-soft:#222B55;
  --cash:#52CF8F; --cash-soft:#12301F;
  --paynow:#D493EB; --paynow-soft:#34193F;
  --warn:#F2B35E; --warn-soft:#3B2A0D;
  --bad:#FF8087; --bad-soft:#40181C;
  --paper:#FBFBF7; --paper-ink:#1C1C1A; --paper-line:#B7B7AE;
  --ph-s:22%; --ph-l:26%; --ph-ink:78%;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.45);
  --scrim:rgba(0,0,0,.62);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font:500 15px/1.45 var(--font-ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 40px; -webkit-text-size-adjust:100%;
}
body.has-bar{padding-block:0 104px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.wrap{max-width:1180px;margin:0 auto}
.mono{font-family:var(--font-mono)}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* chrome */
.chrome{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-top:12px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{min-width:0;display:flex;flex-direction:column;gap:4px}
.brand h1{font:800 20px/1.15 var(--font-ui);letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.daychip{display:inline-flex;align-items:center;gap:6px;font:700 12px var(--font-ui);color:var(--muted)}
.daychip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line)}
.daychip.on{color:var(--cash)}
.daychip.on::before{background:var(--cash)}
.topright{display:flex;align-items:center;gap:8px;flex:none}
.drawer{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;padding:6px 12px;border-radius:12px;background:var(--cash-soft);color:var(--cash)}
.drawer span{font:700 10px var(--font-ui);text-transform:uppercase;letter-spacing:.08em}
.drawer strong{font:500 17px var(--font-mono)}
.saving{font:700 12px var(--font-ui);color:var(--muted)}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.span-all{grid-column:1/-1}
.mt16{margin-top:16px}
.stack14{display:grid;gap:14px}
.h3c{font:800 16px var(--font-ui);margin-bottom:6px}
.tight{padding:6px 16px}
.closebox{margin-top:16px;display:grid;gap:12px}
.js-start{justify-self:start}
.as-center{align-self:center}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);margin-top:10px;border-bottom:1px solid var(--line)}
.tab{appearance:none;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;color:var(--muted);font:700 12px var(--font-ui);padding:8px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
@media(min-width:640px){.tab{flex-direction:row;justify-content:center;gap:8px;font-size:14px;padding:11px 4px}}
.banner{margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font:700 13px var(--font-ui)}
main{padding-top:16px;min-height:50vh}

/* shared bits */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.cta{width:100%;padding:15px 16px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font:800 16px var(--font-ui)}
.cta[disabled]{background:var(--line);color:var(--muted);cursor:not-allowed}
.btn{padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 14px var(--font-ui)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff}
.btn.sm{padding:7px 10px;font-size:13px;border-radius:10px}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--accent);font:700 13px var(--font-ui)}
.x{width:36px;height:36px;border-radius:10px;border:0;background:var(--surface-2);font:500 22px/1 var(--font-ui);color:var(--muted)}
.chip{display:inline-flex;align-items:center;padding:3px 8px;border-radius:999px;font:700 11px var(--font-ui);letter-spacing:.02em;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.low{background:var(--warn-soft);color:var(--warn)}
.chip.out,.chip.void{background:var(--bad-soft);color:var(--bad)}
.chip.ok,.chip.cash{background:var(--cash-soft);color:var(--cash)}
.chip.paynow{background:var(--paynow-soft);color:var(--paynow)}
.field{display:grid;gap:6px}
.field label,.lbl{font:700 13px var(--font-ui);color:var(--muted)}
.hint{font-weight:500}
.text{width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);font:600 16px var(--font-ui);color:var(--ink)}
.text:focus{outline:none;border-color:var(--accent)}
.money{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:12px;padding:0 12px;background:var(--surface-2)}
.money span{font:500 20px var(--font-mono);color:var(--muted)}
.money input{border:0;background:transparent;width:100%;min-width:0;padding:12px 0;font:500 24px var(--font-mono);color:var(--ink)}
.money input:focus{outline:none}
.money:focus-within{border-color:var(--accent)}
.money.sm input{font-size:18px;padding:10px 0}
.err{color:var(--bad);font:700 13px var(--font-ui);min-height:0}
.err:empty{display:none}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px;display:grid;gap:12px;justify-items:center}
.empty strong{color:var(--ink);font-size:16px}
.sub{color:var(--muted);font-size:13px}
.subhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.pagehead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.pagehead h2{font:800 20px var(--font-ui)}
.seg2{display:inline-grid;grid-auto-flow:column;gap:4px;padding:4px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.seg2 button{border:0;background:none;padding:8px 14px;border-radius:9px;font:700 14px var(--font-ui);color:var(--muted)}
.seg2 button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
h3.sec{font:800 15px var(--font-ui);margin:22px 0 10px}

/* product art */
.pic{position:relative;aspect-ratio:1/1;max-width:100%;background:hsl(var(--h,210) var(--ph-s) var(--ph-l));display:grid;place-items:center;overflow:hidden}
.pic .ini{font:800 28px var(--font-ui);color:hsl(var(--h,210) 40% var(--ph-ink));letter-spacing:.02em}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pic img.broken{visibility:hidden}
.pic.sm{width:44px;border-radius:10px;flex:none}
.pic.sm .ini{font-size:15px}

/* sell */
.sell{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
.searchrow{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.search{flex:1;min-width:0;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font:600 15px var(--font-ui)}
.search:focus{outline:none;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:12px}
.tile{position:relative;display:flex;flex-direction:column;text-align:left;padding:0;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;color:inherit}
.tile:active:not([disabled]){transform:scale(.98)}
.tile[disabled]{cursor:not-allowed}
.tile[disabled] .meta,.tile[disabled] .pic img,.tile[disabled] .pic .ini{opacity:.5}
.tile .meta{padding:10px 12px 12px;display:grid;gap:3px}
.tile .nm{font-weight:700;line-height:1.25;min-height:2.5em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.tile .pr{font:500 16px var(--font-mono)}
.tile .stk{position:absolute;left:8px;bottom:8px}
.tile .stk .chip{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.tile .stk .chip.low{background:var(--warn-soft)}
.tile .stk .chip.out{background:var(--bad-soft)}
.tile .inc{position:absolute;right:8px;top:8px;min-width:28px;height:28px;padding:0 8px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:800 14px/28px var(--font-ui);text-align:center}
.cart{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(var(--chrome-h) + env(safe-area-inset-top,0px) + 8px);max-height:calc(100dvh - var(--chrome-h) - 24px);overflow:auto}
.cart-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cart-head h2{font:800 18px var(--font-ui)}
.cart-head .x{display:none}
.cart-actions{display:flex;align-items:center;gap:10px}
.lines{list-style:none;margin:0;padding:0;display:grid}
.lines li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.lines li:first-child{border-top:0}
.ln{min-width:0;display:grid}
.ln .nm{font-weight:700;overflow-wrap:anywhere}
.ln .unit{color:var(--muted);font-size:12px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.qty button{width:34px;height:34px;border:0;background:var(--surface-2);font:700 18px var(--font-ui)}
.qty span{min-width:30px;text-align:center;font:500 15px var(--font-mono)}
.amt{font:500 15px var(--font-mono);min-width:64px;text-align:right}
.total{display:flex;justify-content:space-between;align-items:baseline;padding-top:12px;border-top:2px solid var(--ink)}
.total span{font:800 14px var(--font-ui);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.total strong{font:500 34px var(--font-mono);letter-spacing:-.02em}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font:800 15px var(--font-ui);color:var(--ink)}
.seg button[aria-pressed="true"][data-m="cash"]{border-color:var(--cash);background:var(--cash-soft);color:var(--cash)}
.seg button[aria-pressed="true"][data-m="paynow"]{border-color:var(--paynow);background:var(--paynow-soft);color:var(--paynow)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font:500 14px var(--font-mono)}
.change{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px;border-radius:12px;background:var(--cash-soft);color:var(--cash)}
.change span{font:800 13px var(--font-ui);text-transform:uppercase;letter-spacing:.06em}
.change strong{font:500 30px var(--font-mono)}
.change.idle{background:var(--surface-2);color:var(--muted)}
.change.short{background:var(--bad-soft);color:var(--bad)}
.pnbox{display:grid;gap:10px;justify-items:center;text-align:center;padding:14px;border-radius:12px;background:var(--paynow-soft);color:var(--paynow)}
.pnbox img.qr{width:min(100%,220px);aspect-ratio:1/1;object-fit:contain;background:#fff;border-radius:10px;padding:8px}
.pnbox p{font:700 13px var(--font-ui)}
.cartempty{padding:22px 8px;text-align:center;color:var(--muted)}
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:35;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--bg);border-top:1px solid var(--line)}
.cartbar button{width:100%;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:800 16px var(--font-ui)}
.cartbar strong{font:500 20px var(--font-mono)}
.scrim{position:fixed;inset:0;z-index:38;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
@media(max-width:899px){
  .sell{grid-template-columns:minmax(0,1fr)}
  .cart{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:40;max-height:88dvh;border-radius:18px 18px 0 0;border-width:1px 0 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .22s ease;box-shadow:var(--shadow)}
  .cart:not(.open){visibility:hidden;transition:transform .22s ease,visibility 0s .22s}
  .cart.open{transform:none;visibility:visible}
  .cart-head .x{display:block}
}
@media(min-width:900px){.cartbar,.scrim{display:none}}

/* gate */
.gate{max-width:480px;margin:8px auto 0;display:grid;gap:16px}
.gate h2{font:800 24px var(--font-ui);letter-spacing:-.01em}
.gate .lede{color:var(--muted)}

/* lists */
.prow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:8px}
.prow .pinfo{flex:1;min-width:0;display:grid;gap:2px}
.prow .pinfo strong{overflow-wrap:anywhere}
.prow .chev{color:var(--muted);font-size:20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:4px}
.stat .k{font:700 12px var(--font-ui);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat .v{font:500 26px var(--font-mono);letter-spacing:-.02em}
.stat.cash .v{color:var(--cash)}
.stat.paynow .v{color:var(--paynow)}
.stat.low .v{color:var(--warn)}
.sum{margin:0;display:grid;gap:8px}
.sum div{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.sum dt{color:var(--muted);font-weight:600}
.sum dd{margin:0;font:500 16px var(--font-mono)}
.sum .tot{padding-top:8px;border-top:2px solid var(--ink)}
.sum .tot dt{color:var(--ink);font-weight:800}
.sum .tot dd{font-size:22px}
.variance{padding:10px 12px;border-radius:12px;font:700 14px var(--font-ui);background:var(--surface-2);color:var(--muted)}
.variance.ok{background:var(--cash-soft);color:var(--cash)}
.variance.over{background:var(--warn-soft);color:var(--warn)}
.variance.short{background:var(--bad-soft);color:var(--bad)}
.twocol{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:760px){.twocol{grid-template-columns:minmax(0,1fr)}}
.irow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.irow:first-child{border-top:0}
.irow .n{font-weight:700;overflow-wrap:anywhere;min-width:0}
.irow .q{color:var(--muted);font-weight:600;margin-left:6px}
.irow .m{font:500 15px var(--font-mono);white-space:nowrap}
.txns{list-style:none;margin:0;padding:0}
.txns li{padding:12px 0;border-top:1px solid var(--line);display:grid;gap:8px}
.txns li:first-child{border-top:0}
.txns .top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.txns .l{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.txns .l .no{font:500 14px var(--font-mono)}
.txns .amt2{font:500 16px var(--font-mono)}
.txns li.voided .amt2{text-decoration:line-through;color:var(--muted)}
.txns li.none{padding:14px 0}
.txns .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.txns .ask{font:700 13px var(--font-ui);color:var(--bad)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font:700 12px var(--font-ui);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
.tbl tr:first-child td{border-top:0}
.tbl .n{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .bal{font-size:18px;font-weight:500}
.cellp{display:flex;align-items:center;gap:10px;min-width:0}
@media(max-width:560px){.hide-sm{display:none}}
.cellp .who{display:grid;gap:3px;justify-items:start;min-width:0}
.cellp .who strong{overflow-wrap:anywhere}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font:700 13px var(--font-ui);color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
details.day{padding:0;margin-bottom:10px;overflow:hidden}
details.day summary{list-style:none;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 16px;cursor:pointer}
details.day summary::-webkit-details-marker{display:none}
details.day .dd{font-weight:800}
details.day .ds{color:var(--muted);font-size:13px}
details.day strong{font:500 17px var(--font-mono)}
.dbody{padding:0 16px 16px;display:grid;gap:14px;border-top:1px solid var(--line)}
.dbody .sum{margin-top:14px}

/* modal */
.overlay{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim);padding-top:env(safe-area-inset-top,0px)}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:92dvh;overflow:auto;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px;align-content:start}
@media(min-width:640px){.overlay{align-items:center}.sheet{border-radius:18px;padding-left:20px;padding-right:20px}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet-head h2{font:800 20px var(--font-ui)}
.photo{position:relative;width:100%;max-width:220px;margin:0 auto;aspect-ratio:1/1;border-radius:16px;border:2px dashed var(--line);background:var(--surface-2);overflow:hidden;display:grid;place-items:center;padding:0;color:var(--muted)}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo .pl{display:grid;gap:6px;justify-items:center;font:700 13px var(--font-ui);position:relative;padding:10px;text-align:center}
.photo .pl .ico{width:30px;height:30px}
.photo .re{position:absolute;left:8px;right:8px;bottom:8px;z-index:1;padding:6px;border-radius:8px;background:rgba(0,0,0,.6);color:#fff;font:700 12px var(--font-ui);text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .cta{flex:1;min-width:150px;width:auto}
.paper{background:var(--paper);color:var(--paper-ink);font:400 13px/1.55 var(--font-mono);padding:20px 18px 22px;width:min(100%,340px);margin:0 auto;border-radius:4px;box-shadow:var(--shadow);position:relative}
.paper .c{text-align:center}
.paper .shop{font:500 16px var(--font-mono);letter-spacing:.06em;text-transform:uppercase}
.paper hr{border:0;border-top:1px dashed var(--paper-line);margin:10px 0}
.paper .r{display:flex;justify-content:space-between;gap:12px}
.paper .r span:first-child{min-width:0;overflow-wrap:anywhere}
.paper .r.big{font-size:16px;font-weight:500}
.paper .stamp{margin-top:8px;text-align:center;font:500 18px var(--font-mono);letter-spacing:.2em;color:#B3261E;border:2px solid #B3261E;padding:2px 0;transform:rotate(-4deg)}
.toast{position:fixed;left:50%;transform:translate(-50%,-16px);top:calc(env(safe-area-inset-top,0px) + 10px);z-index:80;max-width:min(92vw,420px);padding:11px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font:700 14px var(--font-ui);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--bad);color:#fff}
.chrome[hidden]{display:none}
.catbar{margin-bottom:12px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
.catbar[hidden]{display:none}
.chip.deal{background:var(--accent);color:var(--accent-ink)}
.tile .stk{display:flex;gap:4px;flex-wrap:wrap;right:8px}
.tile .stk .chip.deal{background:var(--accent);color:var(--accent-ink)}
.was{font-size:12px;color:var(--muted);font-weight:400}
.ln .deal{display:block;color:var(--accent);font-size:12px;font-weight:700;margin-top:2px;overflow-wrap:anywhere}
.tog{margin-top:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font:700 11px var(--font-ui);color:var(--muted)}
.tog[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:700}
.check input{width:20px;height:20px;margin-top:1px;flex:none}
.brow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.brow:first-child{border-top:0}
.brow .bn{flex:1;min-width:0;display:grid;gap:1px}
.brow.on .bn strong{color:var(--accent)}
.bnote{display:block;font-size:11px;color:var(--muted)}
.cathead{display:flex;justify-content:space-between;font:800 12px var(--font-ui);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 2px 8px}
.cathead:first-child{margin-top:4px}
.items tr.grp td{background:color-mix(in srgb,var(--ink) 6%,transparent);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.items.cats tr.it td:first-child{padding-left:18px}
.catbar button{flex:none;white-space:nowrap}
.catpick button{font:700 13px var(--font-ui);padding:7px 12px}
.catpick button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cellp .who .sub{font-size:12px}
.items td:first-child{overflow-wrap:anywhere;font-weight:600}
.items .zero td{color:var(--muted)}
.items tfoot td{font-weight:800;border-top:2px solid var(--ink)}
.items.tbl th,.items.tbl td{padding-left:8px;padding-right:8px}
.qrbox{display:grid;gap:8px;justify-items:center;text-align:center}
.qrbox p{display:grid;gap:2px}
.qrimg{width:min(100%,260px);background:#fff;border-radius:10px;padding:8px;border:1px solid var(--line)}
.qrimg svg{display:block;width:100%;height:auto}
.pubr{max-width:380px;margin:8px auto 0}
.c{text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(max-width:390px){#shopname{font-size:18px}.topbar{gap:8px}.topright{gap:6px}.iconbtn{width:36px;height:36px}.drawer{padding:4px 8px}.drawer strong{font-size:15px}.drawer span{font-size:9px}}
</style>
</head>
<body>

<div class="wrap" id="app">
  <div class="chrome" id="chrome">
    <div class="topbar">
      <div class="brand"><h1 id="shopname">NSA POS 2026</h1><span class="daychip" id="daychip">Loading</span></div>
      <div class="topright">
        <span class="saving" id="saving" hidden>Saving…</span>
        <div class="drawer" id="drawer" hidden></div>
        <button class="iconbtn" id="gear" data-act="settings" aria-label="Shop settings"></button>
        <button class="iconbtn" id="logout" data-act="logout" aria-label="Log out" title="Log out" hidden></button>
      </div>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
    <div class="banner" id="banner" role="status" hidden></div>
  </div>
  <main id="view"></main>
</div>
<div class="cartbar" id="cartbar" hidden></div>
<div class="scrim" id="scrim" data-act="cart-close"></div>
<div id="modal"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

  return /^\d{1,7}$/.test(s)?parseInt(s,10):null;
}
function bogoOn(p,ov){return ov&&Object.prototype.hasOwnProperty.call(ov,p.id)?!!ov[p.id]:!!p.bogo;}
function cartLines(cart,products,bundles,ov){
  var by=new Map((products||[]).map(function(p){return [p.id,p];}));
  var bb=new Map((bundles||[]).map(function(b){return [b.id,b];}));
  var lines=[];
  Object.keys(cart).forEach(function(k){
    var qty=cart[k];
    if(!(qty>0)) return;
    if(k.indexOf('b:')===0){
      var b=bb.get(k.slice(2)); if(!b||!b.items||!b.items.length) return;
      var parts=[], reg=0, bad=false;
      b.items.forEach(function(x){var p=by.get(x.pid); if(!p){bad=true;return;} parts.push({pid:p.id,name:p.name,qty:x.qty,priceCents:p.priceCents}); reg+=p.priceCents*x.qty;});
      if(bad) return;
      lines.push({key:k,bid:b.id,pid:null,bundle:true,name:b.name,priceCents:b.priceCents,qty:qty,free:0,lineCents:b.priceCents*qty,parts:parts,regularCents:reg});
      return;
    }
    var p=by.get(k); if(!p) return;
    var on=bogoOn(p,ov), free=on?Math.floor(qty/2):0;
    lines.push({key:k,pid:k,name:p.name,priceCents:p.priceCents,qty:qty,free:free,bogo:on,lineCents:p.priceCents*(qty-free)});
  });
  return lines;
}
/* split a total into whole cents in proportion to weights; always adds up exactly */
function allocate(total,weights){
  var n=weights.length, sum=weights.reduce(function(a,b){return a+b;},0), base=[], fr=[];
  weights.forEach(function(w,i){
    if(sum>0){base.push(Math.floor(total*w/sum)); fr.push((total*w)%sum);}
    else{base.push(Math.floor(total/n)); fr.push(0);}
  });
  var rem=total-base.reduce(function(a,b){return a+b;},0);
  var order=base.map(function(_,i){return i;}).sort(function(a,b){return fr[b]-fr[a]||a-b;});
  for(var i=0;rem>0;i=(i+1)%n,rem--) base[order[i]]++;
  return base;
}
/* what is stored on the sale: one row per product, free units and bundle shares included, so every total adds up */
function saleItems(lines){
  var out=[];
  lines.forEach(function(l){
    if(l.bundle){
      var units=[];
      l.parts.forEach(function(p){for(var i=0;i<p.qty;i++) units.push(p);});
      var al=allocate(l.priceCents,units.map(function(u){return u.priceCents;})), rows=new Map();
      units.forEach(function(u,i){
        var k=u.pid+'|'+al[i], r=rows.get(k);
        if(!r){r={pid:u.pid,name:u.name,priceCents:al[i],qty:0,bundle:l.name};rows.set(k,r);out.push(r);}
        r.qty+=l.qty;
      });
    }else{
      var paid=l.qty-l.free;
      if(paid>0) out.push({pid:l.pid,name:l.name,priceCents:l.priceCents,qty:paid});
      if(l.free>0) out.push({pid:l.pid,name:l.name,priceCents:0,qty:l.free,free:true});
    }
  });
  return out;
}
/* units of each product the order will take out of stock */
function cartNeeds(lines){
  var m={};
  lines.forEach(function(l){
    if(l.bundle) l.parts.forEach(function(p){m[p.pid]=(m[p.pid]||0)+p.qty*l.qty;});
    else m[l.pid]=(m[l.pid]||0)+l.qty;
  });
  return m;
}
function itemLabel(it){return it.name+(it.free?' (free)':'');}
function cartTotal(lines){return lines.reduce(function(s,l){return s+l.lineCents;},0);}
function quickTenders(total){
  if(!(total>0)) return [];
  var out=[], dollars=total/100;
  SGD_NOTES.forEach(function(n){ if(n*100>total) out.push(n*100); });
  if(out.length<2){
    [10,50,100].forEach(function(step){
      var v=Math.ceil(dollars/step)*step*100;
      if(v>total && out.indexOf(v)<0) out.push(v);
    });
  }
  out.sort(function(a,b){return a-b;});
  return out.slice(0,4);
}
function applyDelta(stock,delta){return Math.max(0,(stock||0)+delta);}
function stockStatus(p){return p.stock>0?'ok':'out';}
function normCat(s){return String(s==null?'':s).replace(/\s+/g,' ').trim().slice(0,30);}
function sameCat(a,b){return normCat(a).toLowerCase()===normCat(b).toLowerCase();}
function categoriesOf(products){
  var seen=new Map();
  (products||[]).forEach(function(p){var c=normCat(p.category); if(c&&!seen.has(c.toLowerCase())) seen.set(c.toLowerCase(),c);});
  return Array.from(seen.values()).sort(function(a,b){return a.localeCompare(b);});
}
function daySummary(sales,floatCents){
  var rev=0,cash=0,pn=0,count=0,voided=0,units=0,items=new Map();
  sales.forEach(function(s){
    if(s.voided){voided++;return;}
    count++; rev+=s.totalCents;
    if(s.method==='cash') cash+=s.totalCents; else pn+=s.totalCents;
    s.items.forEach(function(it){
      units+=it.qty;
      var k=it.pid||it.name, e=items.get(k);
      if(!e){e={name:it.name,qty:0,cents:0};items.set(k,e);}
      e.qty+=it.qty; e.cents+=it.priceCents*it.qty;
    });
  });
  return {count:count,voided:voided,units:units,revenueCents:rev,cashCents:cash,paynowCents:pn,
    expectedCashCents:floatCents+cash,
    items:Array.from(items.values()).sort(function(a,b){return b.cents-a.cents;})};
}
function soldByProduct(sales){
  var m={};
  sales.forEach(function(s){ if(s.voided) return; s.items.forEach(function(it){ if(it.pid) m[it.pid]=(m[it.pid]||0)+it.qty; }); });
  return m;
}
function groupByCategory(rows){
  var m=new Map();
  (rows||[]).forEach(function(r){
    var c=normCat(r.category), k=c.toLowerCase();
    if(!m.has(k)) m.set(k,{cat:c,rows:[],qty:0,cents:0,left:0});
    var g=m.get(k); g.rows.push(r); g.qty+=r.qty||0; g.cents+=r.cents||0; g.left+=r.left||0;
  });
  return Array.from(m.values()).sort(function(a,b){
    if(!a.cat) return 1; if(!b.cat) return -1; return a.cat.localeCompare(b.cat);
  });
}
/* one row per product: sold today (qty, amount) and what is left. Sold items whose product was deleted keep a row with left=null. */
function itemsSummary(sales,products){
  var by=new Map(), rows=[];
  (products||[]).forEach(function(p){
    var r={pid:p.id,name:p.name,category:normCat(p.category),qty:0,cents:0,left:p.stock||0};
    by.set(p.id,r); rows.push(r);
  });
  sales.forEach(function(sl){
    if(sl.voided) return;
    sl.items.forEach(function(it){
      var k=it.pid||('n:'+it.name), r=by.get(k);
      if(!r){r={pid:it.pid||null,name:it.name,category:'',qty:0,cents:0,left:null};by.set(k,r);rows.push(r);}
      r.qty+=it.qty; r.cents+=it.priceCents*it.qty;
    });
  });
  return rows.sort(function(a,b){return b.cents-a.cents||a.name.localeCompare(b.name);});
}
function stockRows(products,sold){
  return products.slice().sort(function(a,b){
    var ca=normCat(a.category)||'~', cb=normCat(b.category)||'~';
    return ca.localeCompare(cb)||a.name.localeCompare(b.name);
  }).map(function(p){
    var st=p.stock||0;
    return {name:p.name,category:normCat(p.category),priceCents:p.priceCents,stock:st,sold:(sold&&sold[p.id])||0,valueCents:st*p.priceCents};
  });
}
/* receipt QR: the receipt travels inside the link, so the customer needs no login */
function b64url(str){
  var b=new TextEncoder().encode(str), t='';
  b.forEach(function(x){t+=String.fromCharCode(x);});
  return btoa(t).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function unb64url(t){
  t=t.replace(/-/g,'+').replace(/_/g,'/'); while(t.length%4) t+='=';
  var bin=atob(t), b=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(b);
}
function receiptPayload(sl){
  return b64url(JSON.stringify([1,Math.round(sl.ts/1000),sl.receiptNo,sl.method==='cash'?'c':'p',sl.tenderedCents||0,sl.changeCents||0,
    sl.items.map(function(it){return [String(itemLabel(it)).slice(0,40),it.qty,it.priceCents];})]));
}
function parseReceiptHash(h){
  var m=/^#r=([A-Za-z0-9_-]+)$/.exec(h||''); if(!m) return null;
  try{
    var a=JSON.parse(unb64url(m[1]));
    if(!Array.isArray(a)||a[0]!==1||!Array.isArray(a[6])||!a[6].length) return null;
    var items=a[6].map(function(x){return {name:String(x[0]),qty:Number(x[1]),priceCents:Number(x[2])};});
    if(!items.every(function(i){return isFinite(i.qty)&&i.qty>0&&isFinite(i.priceCents)&&i.priceCents>=0;})) return null;
    var total=items.reduce(function(t,i){return t+i.qty*i.priceCents;},0);
    var cash=a[3]==='c';
    return {ts:Number(a[1])*1000,receiptNo:String(a[2]),method:cash?'cash':'paynow',tenderedCents:cash?Number(a[4])||0:total,
      changeCents:cash?Number(a[5])||0:0,items:items,totalCents:total,voided:false};
  }catch(e){return null;}
}
var DF=new Intl.DateTimeFormat('en-SG',{day:'numeric',month:'short',year:'numeric'});
var TF=new Intl.DateTimeFormat('en-SG',{hour:'numeric',minute:'2-digit'});
function dt(ts){return DF.format(new Date(ts));}
function tm(ts){return TF.format(new Date(ts));}
function rno(ts,n){
  var d=new Date(ts);
  return ''+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'-'+String(n).padStart(3,'0');
}
function padRow(l,r,w){
  l=String(l); r=String(r);
  var room=w-r.length-1;
  if(l.length>room) l=l.slice(0,Math.max(0,room-1))+'…';
  return l+' '.repeat(Math.max(1,w-l.length-r.length))+r;
}
function receiptText(shop,s){
  var W=32,L=[];
  L.push((shop||'Receipt').toUpperCase());
  L.push(dt(s.ts)+', '+tm(s.ts));
  L.push('No. '+s.receiptNo);
  L.push('-'.repeat(W));
  s.items.forEach(function(it){L.push(padRow(it.qty+' x '+itemLabel(it),fmt(it.priceCents*it.qty),W)); if(it.bundle) L.push('   in '+it.bundle);});
  L.push('-'.repeat(W));
  L.push(padRow('TOTAL',fmt(s.totalCents),W));
  if(s.method==='cash'){L.push(padRow('Cash',fmt(s.tenderedCents),W));L.push(padRow('Change',fmt(s.changeCents),W));}
  else L.push(padRow('Paid by','PayNow',W));
  if(s.voided) L.push('*** VOIDED ***');
  L.push('Thank you!');
  return L.join('\n');
}
function reportText(shop,d){
  var W=32,L=[];
  L.push((shop||'Shop')+' - daily report');
  L.push(dt(d.openedAt));
  L.push('-'.repeat(W));
  L.push(padRow('Sales',String(d.salesCount),W));
  L.push(padRow('Items sold',String(d.units),W));
  L.push(padRow('Total sales',fmt(d.revenueCents),W));
  L.push(padRow('  Cash',fmt(d.cashCents),W));
  L.push(padRow('  PayNow',fmt(d.paynowCents),W));
  L.push('-'.repeat(W));
  L.push(padRow('Opening petty cash',fmt(d.floatCents),W));
  L.push(padRow('+ Cash sales',fmt(d.cashCents),W));
  L.push(padRow('Petty cash balance',fmt(d.expectedCashCents),W));
  if(d.countedCents!=null){
    L.push(padRow('Counted',fmt(d.countedCents),W));
    var v=d.countedCents-d.expectedCashCents;
    L.push(padRow(v===0?'Drawer matches':(v>0?'Over':'Short'),v===0?'':fmt(Math.abs(v)),W));
  }
  var sold=(d.items||[]).filter(function(it){return it.qty>0;});
  if(sold.length){
    L.push('-'.repeat(W)); L.push('Items sold');
    var gs=groupByCategory(sold), anyCat=gs.some(function(g){return g.cat;});
    gs.forEach(function(g){
      if(anyCat) L.push(padRow('['+(g.cat||'Other')+']',fmt(g.cents),W));
      g.rows.forEach(function(it){
        L.push(padRow(it.qty+' x '+it.name,fmt(it.cents),W));
        if(it.left!=null) L.push('   balance: '+it.left+' left');
      });
    });
  }
  var rest=(d.items||[]).filter(function(it){return !(it.qty>0)&&it.left!=null;});
  if(rest.length){
    L.push('-'.repeat(W)); L.push('Not sold today (balance)');
    rest.forEach(function(it){L.push(padRow(it.name,String(it.left),W));});
  }
  return L.join('\n');
}
function stockText(shop,products,ts){
  var L=[(shop||'Shop')+' - stock list', dt(ts)+', '+tm(ts), '--------------------------------'];

  });

}

/* ---------- write queue (one write at a time per document) ---------- */
function enqueue(key,job,label){
  S.pending++; updateChrome();
  var prev=S.qs.get(key)||Promise.resolve();
  var p=prev.then(job).catch(function(err){
    console.error(err);
    toast((label?label+': ':'')+'could not be saved. Check your connection and try again.','bad');
  }).then(function(){S.pending--;updateChrome();if(S.qs.get(key)===p)S.qs.delete(key);});
  S.qs.set(key,p);
  return p;
}

/* ---------- photos ---------- */
function shrink(file,max,mime,q){
  var url=URL.createObjectURL(file);
  return new Promise(function(res,rej){
    var i=new Image(); i.onload=function(){res(i);}; i.onerror=function(){rej(new Error('image'));}; i.src=url;
  }).then(function(img){
    var r=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    var w=Math.max(1,Math.round(img.naturalWidth*r)), h=Math.max(1,Math.round(img.naturalHeight*r));
    var c=document.createElement('canvas'); c.width=w; c.height=h;
    var g=c.getContext('2d');
    if(mime==='image/jpeg'){g.fillStyle='#fff';g.fillRect(0,0,w,h);}
    g.drawImage(img,0,0,w,h);
    return new Promise(function(res,rej){c.toBlob(function(b){b?res(b):rej(new Error('encode'));},mime,q);});
  }).then(function(b){URL.revokeObjectURL(url);return b;},function(e){URL.revokeObjectURL(url);throw e;});
}
function blobToData(b){
  return new Promise(function(res,rej){var f=new FileReader();f.onload=function(){res(f.result);};f.onerror=function(){rej(f.error);};f.readAsDataURL(b);});
}
/* returns {id,data}: stored asset id when uploads work, else a small inline copy */
function storePhoto(file,opt){
  var mime=opt.mime, max=opt.max;
  var inline=function(){return shrink(file,opt.fallbackMax,mime,0.72).then(blobToData).then(function(d){return {id:null,data:d};});};
  if(!S.assets) return inline();
  return shrink(file,max,mime,0.82)
    .then(function(b){return S.assets.upload(b,{type:mime});})
    .then(function(r){return {id:r.id,data:null};})
    .catch(function(){return inline();});
}

  if(k!==S.key){S.key=k;mountView(k);}else updateView(k);
  document.body.classList.toggle('has-bar',k==='sell'&&cartCount()>0);

}
function mountView(k){
  S.cartOpen=false; $('#scrim').classList.remove('show');
  if(k==='noconfig'){V.innerHTML='<div class="empty"><strong>Finish setup</strong><span>Open config.js, paste in your Firebase settings, then reload this page. The setup guide has the steps.</span></div>';return;}
  if(k==='nodb'){V.innerHTML='<div class="empty"><strong>Could not load the database</strong><span>Check your internet connection and reload the page.</span></div>';return;}
  if(k==='signin'){V.innerHTML=signinHTML();return;}
  if(k==='denied'){V.innerHTML='<div class="empty"><strong>This account cannot use this POS</strong><span>Sign in with the account you added to the database rules, or check the rules in Firebase.</span><button class="btn" data-act="signout">Sign out</button></div>';return;}
  if(k==='loading'){V.innerHTML='<div class="empty"><strong>Loading your till</strong><span>Fetching products and today\'s sales.</span></div>';return;}
  if(k==='sell') return mountSell();
  if(k==='gate-sell'){V.innerHTML=gateHTML();return;}
  if(k==='products') return mountProducts();
  if(k==='stock') return mountStock();
  if(k==='report:today:gate'){V.innerHTML=reportHead()+gateHTML();return;}
  if(k==='report:today') return mountReportToday();
  if(k==='report:past') return mountPast();
}
function updateView(k){
  if(k==='sell') return updateSell();
  if(k==='products') return updateProducts();
  if(k==='stock') return updateStock();
  if(k==='report:today') return updateReport();
  if(k==='report:past') return updatePast();
}

function renderCatbar(){
  var bar=$('#catbar'); if(!bar) return;

function inCat(p){
  if(S.cat==='all') return true;
  if(S.cat==='__bundles') return false;
  if(S.cat==='__none') return !normCat(p.category);
  return sameCat(p.category,S.cat);
}
function bundleStats(b){
  var reg=0, max=Infinity, ok=true;
  (b.items||[]).forEach(function(x){
    var p=byId(x.pid);
    if(!p){ok=false;max=0;return;}
    reg+=p.priceCents*x.qty; max=Math.min(max,Math.floor((p.stock||0)/x.qty));
  });
  if(max===Infinity) max=0;
  return {regularCents:reg,ok:ok&&max>0,max:max};
}
function bundleParts(b){
  return (b.items||[]).map(function(x){var p=byId(x.pid); return x.qty+' × '+(p?p.name:'(deleted product)');}).join(', ');
}

  if(sig!==S.gridSig){
    S.gridSig=sig;
    var list=S.products.slice().sort(function(a,b){return a.name.localeCompare(b.name);}).filter(function(p){return inCat(p)&&(!q||p.name.toLowerCase().indexOf(q)>=0);});
    var bl=(S.cat==='all'||S.cat==='__bundles')?S.bundles.filter(function(b){return !q||b.name.toLowerCase().indexOf(q)>=0;}):[];
    if(!S.products.length){
      g.innerHTML='<div class="empty span-all"><strong>No products yet</strong><span>Add what you sell, with a photo, price and how many you have.</span><button class="btn" data-act="new-product">Add your first product</button></div>';
    }else if(!list.length&&!bl.length){
      g.innerHTML='<div class="empty span-all"><strong>No match</strong><span>'+(q?'Nothing called "'+esc(S.query.trim())+'".':'Nothing here yet.')+'</span></div>';
    }else{
      g.innerHTML=bl.map(function(b){
        var st=bundleStats(b);
        return '<button class="tile bundle" data-act="add" data-id="b:'+esc(b.id)+'"'+(st.ok?'':' disabled')+'>'+
          picHTML({name:b.name},'','<span class="stk"><span class="chip deal">Bundle</span></span><span class="inc" hidden></span>')+
          '<span class="meta"><span class="nm">'+esc(b.name)+'</span><span class="pr">'+fmt(b.priceCents)+(st.regularCents>b.priceCents?' <s class="was">'+fmt(st.regularCents)+'</s>':'')+'</span></span></button>';
      }).join('')+list.map(function(p){
        var out=!(p.stock>0);
        return '<button class="tile" data-act="add" data-id="'+esc(p.id)+'"'+(out?' disabled':'')+'>'+
          picHTML(p,'','<span class="stk">'+(p.bogo&&!out?'<span class="chip deal">Buy 1 Get 1</span> ':'')+chipFor(p)+'</span><span class="inc" hidden></span>')+
          '<span class="meta"><span class="nm">'+esc(p.name)+'</span><span class="pr">'+fmt(p.priceCents)+'</span></span></button>';
      }).join('');
      applyHues(g);
    }
  }

function updateBadges(){

function curLines(){return cartLines(S.cart,S.products,S.bundles,S.bogo);}

function cartChanged(){updateBadges();renderCart();updateCartbar();document.body.classList.toggle('has-bar',S.key==='sell'&&cartCount()>0);}
function updateCartbar(){
  var bar=$('#cartbar');

function renderCart(force){
  var el=$('#cart'); if(!el) return;
  var lines=curLines(), total=cartTotal(lines);
  var sig=JSON.stringify([lines,lines.map(function(l){return (l.bundle?l.parts.map(function(x){return x.pid;}):[l.pid]).map(function(id){var p=byId(id);return p?p.stock:0;});}),S.method,qrSrc().length]);

function cartHTML(lines,total){
  var head='<div class="cart-head"><h2>Order</h2><span class="cart-actions">'+(lines.length?'<button class="linkbtn" data-act="clear">Clear</button>':'')+'<button class="x" data-act="cart-close" aria-label="Close order">×</button></span></div>';
  if(!lines.length) return head+'<div class="cartempty">Tap a product to start an order.</div>';
  var h=head+'<ul class="lines">'+lines.map(function(l){
    var info, extra='';
    if(l.bundle){
      info='Bundle · '+fmt(l.priceCents)+' each';
      extra='<span class="deal">'+esc(l.parts.map(function(x){return x.qty+' × '+x.name;}).join(', '))+(l.regularCents>l.priceCents?' · saves '+fmt((l.regularCents-l.priceCents)*l.qty):'')+'</span>';
    }else{
      info=fmt(l.priceCents)+' each';
      extra=(l.free>0?'<span class="deal">'+l.free+' free (Buy 1 Get 1)</span>':(l.bogo?'<span class="deal">Add 1 more to get 1 free</span>':''))+
        '<button class="tog" data-act="bogo" data-id="'+esc(l.pid)+'" aria-pressed="'+(!!l.bogo)+'">Buy 1 Get 1 free</button>';
    }
    return '<li><div class="ln"><span class="nm">'+esc(l.name)+'</span><span class="unit">'+info+'</span>'+extra+'</div>'+
      '<div class="qty"><button data-act="dec" data-id="'+esc(l.key)+'" aria-label="One less '+esc(l.name)+'">−</button><span>'+l.qty+'</span><button data-act="inc" data-id="'+esc(l.key)+'" aria-label="One more '+esc(l.name)+'">+</button></div>'+
      '<span class="amt">'+fmt(l.lineCents)+'</span></li>';
  }).join('')+'</ul>';
  h+='<div class="total"><span>Total</span><strong id="total">'+fmt(total)+'</strong></div>';
  h+='<div class="seg" role="group" aria-label="Payment method"><button data-act="method" data-m="cash" aria-pressed="'+(S.method==='cash')+'">Cash</button><button data-act="method" data-m="paynow" aria-pressed="'+(S.method==='paynow')+'">PayNow</button></div>';
  if(S.method==='cash'){
    h+='<div class="field"><label for="tender">Customer gives</label><div class="money"><span>$</span><input id="tender" inputmode="decimal" autocomplete="off" placeholder="0.00" value="'+esc(S.tender)+'"></div></div>';
    h+='<div class="chips"><button data-act="tender" data-v="'+total+'">Exact</button>'+quickTenders(total).map(function(v){return '<button data-act="tender" data-v="'+v+'">'+fmt(v).replace('.00','')+'</button>';}).join('')+'</div>';
    h+='<div class="change idle" id="change"></div>';
  }else{
    var qr=qrSrc();
    h+='<div class="pnbox">'+(qr?'<img class="qr" src="'+esc(qr)+'" alt="PayNow QR code">':'')+
      '<p>Ask for '+fmt(total)+' by PayNow. Check the payment has come in before you complete the sale.</p>'+
      (qr?'':'<button class="btn sm" data-act="settings">Add your PayNow QR</button>')+'</div>';
  }
  h+='<button class="cta" id="complete" data-act="complete">Complete sale</button>';
  return h;
}
function updateTender(){
  var btn=$('#complete'); if(!btn) return;
  var lines=curLines(), total=cartTotal(lines), ok=false;
  if(S.method==='cash'){
    var t=parseMoney(S.tender), box=$('#change');
    if(box){
      if(t==null){box.className='change idle';box.innerHTML='<span>Give back</span><strong>—</strong>';}
      else if(t>=total){box.className='change';box.innerHTML='<span>Give back</span><strong>'+fmt(t-total)+'</strong>';ok=true;}
      else{box.className='change short';box.innerHTML='<span>Still owed</span><strong>'+fmt(total-t)+'</strong>';}
    }
  }else ok=true;
  btn.disabled=!(ok&&lines.length);
}
function addToCart(key){
  var parts;
  if(key.indexOf('b:')===0){
    var b=S.bundles.find(function(x){return x.id===key.slice(2);}); if(!b) return;
    parts=b.items;
  }else{ if(!byId(key)) return; parts=[{pid:key,qty:1}]; }
  var used=cartNeeds(curLines());
  for(var i=0;i<parts.length;i++){
    var p=byId(parts[i].pid);
    if(!p){toast('A product in this bundle was deleted');return;}
    if((used[p.id]||0)+parts[i].qty>p.stock){toast(parts.length>1||key.indexOf('b:')===0?(p.stock>0?'Only '+p.stock+' '+p.name+' in stock':p.name+' is sold out'):(p.stock>0?'Only '+p.stock+' in stock':'Sold out'));return;}
  }
  S.cart[key]=(S.cart[key]||0)+1; cartChanged();
}
/* drop or trim cart lines whose products or bundles changed */
function pruneCart(){
  Object.keys(S.cart).forEach(function(k){
    var max;
    if(k.indexOf('b:')===0){
      var b=S.bundles.find(function(x){return x.id===k.slice(2);});
      max=b?bundleStats(b).max:0;
    }else{ var p=byId(k); max=p?p.stock:0; }
    if(!(max>0)) delete S.cart[k]; else if(S.cart[k]>max) S.cart[k]=max;
  });
}
function completeSale(){
  var lines=curLines(); if(!lines.length||!dayOpen()) return;
  var need=cartNeeds(lines), pids=Object.keys(need);
  for(var i=0;i<pids.length;i++){
    var p=byId(pids[i]);
    if(!p||p.stock<need[pids[i]]){toast('Not enough '+(p?p.name:'stock')+' in stock');return;}
  }
  var total=cartTotal(lines), tendered=total, change=0;
  if(S.method==='cash'){
    var t=parseMoney(S.tender);
    if(t==null||t<total) return;
    tendered=t; change=t-total;
  }
  var no=Math.max(S.sales.length,S.lastNo)+1; S.lastNo=no;
  var ref=S.db.collection('sales').doc();
  var sale={dayId:S.meta.dayId,ts:Date.now(),no:no,receiptNo:rno(S.meta.openedAt,no),
    items:saleItems(lines),
    totalCents:total,method:S.method,tenderedCents:tendered,changeCents:change,voided:false};
  enqueue('sales/'+ref.id,function(){return ref.set(sale);},'Sale '+sale.receiptNo);
  pids.forEach(function(pid){enqueue('products/'+pid,function(){return bump(pid,-need[pid]);},'Stock for '+byId(pid).name);});
  S.cart={}; S.bogo={}; S.tender=''; S.cartOpen=false;
  cartChanged(); renderCart(true);
  showReceipt(Object.assign({id:ref.id},sale),true);
}
function voidSale(id){
  var s=S.sales.find(function(x){return x.id===id;}); if(!s||s.voided) return;
  enqueue('sales/'+id,function(){return S.db.doc('sales/'+id).update({voided:true,voidedAt:Date.now()});},'Void');
  s.items.forEach(function(it){ if(it.pid) enqueue('products/'+it.pid,function(){return bump(it.pid,it.qty);},'Stock for '+it.name); });
  S.voidAsk=null; toast('Sale voided. Stock put back.');
}

function saveProduct(){
  var E=S.ed; if(!E||E.saving) return;
  var name=$('#ed-name').value.trim(), price=parseMoney($('#ed-price').value), stock=parseCount($('#ed-stock').value);
  var err=$('#ed-err');
  if(!name){err.textContent='Give the product a name.';return;}
  if(price==null){err.textContent='Enter the price as a dollar amount, like 3.50.';return;}
  if(stock==null){err.textContent='Enter how many you have as a whole number, like 12.';return;}
  var cat=normCat($('#ed-cat').value), known=categoriesOf(S.products).filter(function(c){return sameCat(c,cat);})[0]; if(known) cat=known;
  E.saving=true; var btn=$('[data-m="save"]'); btn.disabled=true; btn.textContent='Saving…';
  var photoStep=E.file?storePhoto(E.file,{max:640,mime:'image/jpeg',fallbackMax:400}):Promise.resolve(null);
  photoStep.then(function(ph){
    var base=E.orig?Object.assign({},E.orig):{createdAt:Date.now()};
    delete base.id; delete base.low;
    var doc=Object.assign(base,{name:name,priceCents:price,stock:stock});
    if(cat) doc.category=cat; else delete doc.category;
    if($('#ed-bogo')&&$('#ed-bogo').checked) doc.bogo=true; else delete doc.bogo;
    if(ph){doc.photoId=ph.id;doc.photoData=ph.data;}
    else if(E.removePhoto){doc.photoId=null;doc.photoData=null;}
    if(doc.photoId==null) delete doc.photoId;
    if(doc.photoData==null) delete doc.photoData;
    var id=E.id||S.db.collection('products').doc().id;
    enqueue('products/'+id,function(){return S.db.doc('products/'+id).set(doc);},name);
    closeModal(); toast(E.id?'Saved '+name:'Added '+name);
  }).catch(function(){
    E.saving=false; btn.disabled=false; btn.textContent='Save product';
    err.textContent='That photo could not be read. Try a different one.';
  });
}

function paintBundleList(){

  }).join('')||'<p class="sub">Add some products first.</p>';
}
function paintBundleSum(){
  var el=$('#be-sum'); if(!el||!S.ed||!S.ed.bundle) return;
  var reg=0, n=0;
  Object.keys(S.ed.q).forEach(function(pid){var p=byId(pid); if(p){reg+=p.priceCents*S.ed.q[pid]; n+=S.ed.q[pid];}});
  var pr=parseMoney($('#be-price').value), t=n?n+' items · bought separately '+fmt(reg):'No items picked yet.';
  if(n&&pr!=null) t+=pr<reg?' · customer saves '+fmt(reg-pr):(pr>reg?' · this costs more than buying separately':' · same as buying separately');
  el.textContent=t;
}
function saveBundle(){
  var E=S.ed; if(!E||!E.bundle) return;
  var name=$('#be-name').value.trim(), price=parseMoney($('#be-price').value), err=$('#ed-err');
  var items=Object.keys(E.q).filter(function(k){return E.q[k]>0&&byId(k);}).map(function(k){return {pid:k,qty:E.q[k]};});
  var units=items.reduce(function(a,x){return a+x.qty;},0);
  if(!name){err.textContent='Give the bundle a name.';return;}
  if(units<2){err.textContent='A bundle needs at least 2 items. Tap + next to the products.';return;}
  if(price==null){err.textContent='Enter the bundle price as a dollar amount, like 12.00.';return;}
  var nb={id:E.id||('b'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)),name:name,priceCents:price,items:items};
  var list=S.bundles.slice(), at=list.findIndex(function(x){return x.id===nb.id;});
  if(at>=0) list[at]=nb; else list.push(nb);
  storeBundles(list); closeModal(); toast((E.id?'Saved ':'Added ')+name);
}
function deleteBundle(){
  var E=S.ed; if(!E||!E.bundle||!E.id) return;
  var btn=$('[data-m="bdel"]');
  if(!E.armed){E.armed=true;btn.classList.add('armed');btn.textContent='Tap again to delete';return;}
  var id=E.id; delete S.cart['b:'+id];
  storeBundles(S.bundles.filter(function(x){return x.id!==id;}));
  closeModal(); cartChanged(); toast('Bundle deleted');
}
function storeBundles(list){
  S.bundles=list;
  enqueue('meta/bundles',function(){return S.db.doc('meta/bundles').set({list:list});},'Bundles');
  refresh();
}
function deleteProduct(){
  var E=S.ed; if(!E||!E.id) return;
  var btn=$('[data-m="del"]');
  if(!E.armed){E.armed=true;btn.classList.add('armed');btn.textContent='Tap again to delete';return;}
  var id=E.id, name=E.orig.name;

  enqueue('products/'+id,function(){return S.db.doc('products/'+id).delete();},name);
  closeModal(); cartChanged(); toast('Deleted '+name);

function mountStock(){
  V.innerHTML='<div class="pagehead"><h2>Stock</h2><div class="actions"><button class="btn" data-act="copy-stock">Copy list</button><button class="btn" data-act="export-stock-xlsx">Excel</button><button class="btn" data-act="export-stock-pdf">PDF</button></div></div>'+

    '<div id="s-table"></div>';
  updateStock();
  loadLib('pdf').catch(function(){}); loadLib('xlsx').catch(function(){});

function updateStock(){
  var sold=soldByProduct(S.sales), prods=S.products;
  var units=0,value=0,out=0;
  prods.forEach(function(p){units+=p.stock;value+=p.stock*p.priceCents;if(stockStatus(p)==='out')out++;});
  $('#s-stats').innerHTML=
    '<div class="stat"><span class="k">Products</span><span class="v">'+prods.length+'</span></div>'+
    '<div class="stat"><span class="k">Units in stock</span><span class="v">'+units+'</span></div>'+
    '<div class="stat low"><span class="k">Sold out</span><span class="v">'+out+'</span></div>'+
    '<div class="stat"><span class="k">Stock value</span><span class="v">'+fmt(value)+'</span></div>';
  $('#s-filters').innerHTML='<button data-act="stock-filter" data-f="all" aria-pressed="'+(S.sf==='all')+'">All</button><button data-act="stock-filter" data-f="out" aria-pressed="'+(S.sf==='out')+'">Sold out</button>';
  var list=prods.slice().sort(function(a,b){return (stockStatus(a)==='out'?0:1)-(stockStatus(b)==='out'?0:1)||a.name.localeCompare(b.name);});
  if(S.sf==='out') list=list.filter(function(p){return stockStatus(p)==='out';});
  var t=$('#s-table');
  if(!prods.length){t.innerHTML='<div class="empty"><strong>No products yet</strong><span>Your stock balance shows here once you add products.</span>'+(S.staff?'':'<button class="btn" data-act="new-product">Add product</button>')+'</div>';return;}
  if(!list.length){t.innerHTML='<div class="empty"><strong>Nothing is sold out</strong><span>Every product still has stock.</span></div>';return;}
  t.innerHTML='<div class="tablewrap"><table class="tbl"><thead><tr><th>Product</th><th class="n">Left</th><th class="n">Sold today</th><th class="n hide-sm">Price</th></tr></thead><tbody>'+
    list.map(function(p){
      var tag=stockStatus(p)==='out'?'<span class="chip out">Sold out</span>':'', cat=normCat(p.category);
      return '<tr><td><div class="cellp">'+picHTML(p,'sm')+'<div class="who"><strong>'+esc(p.name)+'</strong>'+(cat?'<span class="sub">'+esc(cat)+'</span>':'')+tag+'</div></div></td>'+
        '<td class="n bal">'+p.stock+'</td><td class="n">'+(sold[p.id]||0)+'</td><td class="n hide-sm">'+fmt(p.priceCents)+'</td></tr>';
    }).join('')+'</tbody></table></div>';
  applyHues(t);
}
function stamp(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function stampOf(ts){var x=new Date(ts||Date.now());return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');}
function dayRange(d){return dt(d.openedAt)+'   Open '+tm(d.openedAt)+' to '+(d.closedAt?tm(d.closedAt):'now');}
function dayDiff(d){return d.countedCents!=null?d.countedCents-d.expectedCashCents:null;}
function exportDayXlsx(d){
  if(!d) return;
  toast('Preparing Excel file…');
  loadLib('xlsx').then(function(X){
    var money=function(c){return {v:(c||0)/100,t:'n',z:'$#,##0.00'};}, diff=dayDiff(d);
    var sum=[[shopName()+' - end of day report'],[dayRange(d)],[],
      ['Sales',''],['Total sales',money(d.revenueCents)],['Sales made',d.salesCount],['Voided sales',d.voidedCount||0],['Items sold',d.units],
      ['Cash sales',money(d.cashCents)],['PayNow sales',money(d.paynowCents)],[],
      ['Petty cash',''],['Opening petty cash',money(d.floatCents)],['Cash sales',money(d.cashCents)],
      ['Petty cash balance (should be in drawer)',money(d.expectedCashCents)],
      ['Cash counted',d.countedCents!=null?money(d.countedCents):'not entered'],['Difference (counted minus expected)',diff==null?'':money(diff)]];
    var ws1=X.utils.aoa_to_sheet(sum); ws1['!cols']=[{wch:40},{wch:16}];
    var items=d.items||[], q=0,c=0,l=0, gs=groupByCategory(items), anyCat=gs.some(function(g){return g.cat;});
    var it=[['Item','Category','Sold','Amount','Left (balance)']];
    gs.forEach(function(g){
      g.rows.forEach(function(r){q+=r.qty||0;c+=r.cents||0;l+=r.left||0;it.push([r.name,r.category||'',r.qty||0,money(r.cents),r.left==null?'':r.left]);});
      if(anyCat){it.push(['Subtotal: '+(g.cat||'Other'),'',g.qty,money(g.cents),g.left]); it.push([]);}
    });
    it.push(['Total','',q,money(c),l]);
    var ws2=X.utils.aoa_to_sheet(it); ws2['!cols']=[{wch:32},{wch:16},{wch:8},{wch:12},{wch:14}];
    var wb=X.utils.book_new(); X.utils.book_append_sheet(wb,ws1,'Summary'); X.utils.book_append_sheet(wb,ws2,'Items');
    if(d.txns&&d.txns.length){
      var tx=[['Receipt no.','Time','Payment','Items','Amount','Status']];
      d.txns.forEach(function(t){tx.push([t.no,tm(t.ts),t.method==='cash'?'Cash':'PayNow',t.units,money(t.totalCents),t.voided?'Voided':'OK']);});
      var ws3=X.utils.aoa_to_sheet(tx); ws3['!cols']=[{wch:16},{wch:10},{wch:10},{wch:8},{wch:12},{wch:10}];
      X.utils.book_append_sheet(wb,ws3,'Sales');
    }
    X.writeFile(wb,'end-of-day-'+stampOf(d.openedAt)+'.xlsx');
    toast('Excel report saved');
  }).catch(function(e){console.error(e);toast("Couldn't make the Excel file. Check your internet and try again.",'bad');});
}
function exportDayPdf(d){
  if(!d) return;
  toast('Preparing PDF…');
  loadLib('pdf').then(function(J){
    var doc=new J({unit:'mm',format:'a4'}), diff=dayDiff(d), items=d.items||[], q=0,c=0,l=0;
    doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.text(shopName()+' - end of day report',14,18);
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(110); doc.text(dayRange(d),14,24); doc.setTextColor(0);
    var y=pdfTable(doc,{y0:34,heading:'Summary',cols:[{h:'',w:122},{h:'',w:60,a:'r'}],rows:[
      ['Total sales',fmt(d.revenueCents)],
      ['Sales made',String(d.salesCount)+(d.voidedCount?' ('+d.voidedCount+' voided)':'')],
      ['Items sold',String(d.units)],
      ['Cash sales',fmt(d.cashCents)],['PayNow sales',fmt(d.paynowCents)],
      ['Opening petty cash',fmt(d.floatCents)],
      ['Petty cash balance (should be in drawer)',fmt(d.expectedCashCents)],
      ['Cash counted',d.countedCents!=null?fmt(d.countedCents):'not entered'],
      ['Difference (counted minus expected)',diff==null?'-':(diff===0?'matches':(diff>0?'over ':'short ')+fmt(Math.abs(diff)))]]});
    items.forEach(function(r){q+=r.qty||0;c+=r.cents||0;l+=r.left||0;});
    var gs=groupByCategory(items), anyCat=gs.some(function(g){return g.cat;}), irows=[];
    gs.forEach(function(g){
      if(anyCat) irows.push({group:true,cells:[g.cat||'Other',String(g.qty),fmt(g.cents),String(g.left)]});
      g.rows.forEach(function(r){irows.push([(anyCat?'   ':'')+r.name,String(r.qty||0),r.qty>0?fmt(r.cents):'-',r.left==null?'-':String(r.left)]);});
    });
    y=pdfTable(doc,{y0:y+6,heading:'Items sold and balance',

      rows:irows,foot:['Total',String(q),fmt(c),String(l)]});
    if(d.txns&&d.txns.length){
      pdfTable(doc,{y0:y+6,heading:'Sales',

        rows:d.txns.map(function(t){return [t.no,tm(t.ts),t.method==='cash'?'Cash':'PayNow',String(t.units),fmt(t.totalCents),t.voided?'Voided':'OK'];})});
    }
    doc.save('end-of-day-'+stampOf(d.openedAt)+'.pdf');
    toast('PDF report saved');
  }).catch(function(e){console.error(e);toast("Couldn't make the PDF. Check your internet and try again.",'bad');});
}

  return rows.reduce(function(t,r){t.units+=r.stock;t.sold+=r.sold;t.value+=r.valueCents;return t;},{units:0,sold:0,value:0});
}

/* ---------- downloads: PDF + Excel libraries load only when needed ---------- */
var LIBS={
  pdf:{src:'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js',get:function(){return window.jspdf&&window.jspdf.jsPDF;}},
  xlsx:{src:'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',get:function(){return window.XLSX;}}
};
var libP={};
function loadLib(name){
  var L=LIBS[name];
  if(L.get()) return Promise.resolve(L.get());
  if(!libP[name]) libP[name]=new Promise(function(res,rej){
    var sc=document.createElement('script'); sc.src=L.src; sc.async=true;
    sc.onload=function(){L.get()?res(L.get()):rej(new Error('lib'));};
    sc.onerror=function(){rej(new Error('load'));};
    document.head.appendChild(sc);
  }).catch(function(e){delete libP[name];throw e;});
  return libP[name];
}
function pdfTable(doc,o){
  var m=14, W=210-2*m, y=m+4, xs=[], x=m;
  o.cols.forEach(function(c){xs.push(x);x+=c.w;});
  if(o.title){
    doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.text(o.title,m,y);
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(110); doc.text(o.subtitle,m,y+6); doc.setTextColor(0);
    y+=16;
  } else y=o.y0||y;
  if(o.heading){
    if(y>262){doc.addPage();y=m+6;}
    doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.text(o.heading,m,y); y+=7;
  }
  function fit(t,w){
    t=String(t==null?'':t);
    if(doc.getTextWidth(t)<=w-3) return t;
    while(t.length>1&&doc.getTextWidth(t+'…')>w-3) t=t.slice(0,-1);
    return t+'…';
  }
  function cell(t,i,yy){
    var c=o.cols[i];
    if(c.a==='r') doc.text(String(t),xs[i]+c.w-1.5,yy,{align:'right'}); else doc.text(fit(t,c.w),xs[i]+1.5,yy);
  }
  function header(){
    doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setFillColor(236,239,246); doc.rect(m,y-4.8,W,7,'F');
    o.cols.forEach(function(c,i){cell(c.h,i,y);});
    y+=7.5; doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
  }
  header();
  o.rows.forEach(function(r){
    if(y>280){doc.addPage();y=m+6;header();}
    var g=!Array.isArray(r)&&r.group, cells=g?r.cells:r;
    if(g){doc.setFillColor(244,246,250); doc.rect(m,y-4.8,W,7,'F'); doc.setFont('helvetica','bold');}
    cells.forEach(function(t,i){cell(t,i,y);});
    if(g) doc.setFont('helvetica','normal');
    doc.setDrawColor(225); doc.line(m,y+2.2,m+W,y+2.2); y+=7;
  });
  if(o.foot){
    if(y>280){doc.addPage();y=m+6;}
    doc.setDrawColor(0); doc.line(m,y-3.2,m+W,y-3.2);
    doc.setFont('helvetica','bold');
    o.foot.forEach(function(t,i){cell(t,i,y+1);});
    y+=7;
  }
  return y;
}
function downloadReceiptPdf(sl){

  loadLib('pdf').then(function(J){
    var lines=receiptText(shopName(),sl).split('\n'), lh=4.7, H=Math.max(70,18+lines.length*lh);
    var doc=new J({unit:'mm',format:[80,H]});
    doc.setFont('courier','normal'); doc.setFontSize(9);
    lines.forEach(function(l,i){
      var y=11+i*lh, mid=i<3||l==='Thank you!'||l==='*** VOIDED ***';
      if(mid) doc.text(l,40,y,{align:'center'}); else doc.text(l,9.5,y);
    });

    toast('Receipt PDF saved');
  }).catch(function(e){console.error(e);toast("Couldn't make the PDF. Check your internet and try again.",'bad');});
}
function qrSvg(text){
  if(typeof qrcode==='undefined') return '';
  var q=qrcode(0,'L'); q.addData(text,'Byte'); q.make();
  var n=q.getModuleCount(), d='';
  for(var r=0;r<n;r++) for(var c=0;c<n;c++) if(q.isDark(r,c)) d+='M'+c+' '+r+'h1v1h-1z';
  return '<svg viewBox="-2 -2 '+(n+4)+' '+(n+4)+'" shape-rendering="crispEdges" role="img" aria-label="QR code"><rect x="-2" y="-2" width="'+(n+4)+'" height="'+(n+4)+'" fill="#fff"/><path d="'+d+'" fill="#000"/></svg>';
}

    case 'tab': S.tab=t.dataset.tab; refresh(); window.scrollTo(0,0); break;
    case 'add': addToCart(id); break;
    case 'inc': addToCart(id); break;
    case 'dec': if(S.cart[id]>1) S.cart[id]--; else delete S.cart[id]; cartChanged(); break;
    case 'clear': S.cart={}; S.bogo={}; S.tender=''; cartChanged(); break;
    case 'bogo': var bp=byId(id); if(bp){S.bogo[id]=!bogoOn(bp,S.bogo); cartChanged();} break;
    case 'new-bundle': openBundle(null); break;
    case 'edit-bundle': openBundle(id); break;
    case 'method': S.method=t.dataset.m; renderCart(); break;
    case 'tender': S.tender=(Number(t.dataset.v)/100).toFixed(2); var ti=$('#tender'); if(ti) ti.value=S.tender; updateTender(); break;
    case 'complete': completeSale(); break;
    case 'cart-open': S.cartOpen=true; renderCart(); updateCartbar(); break;
    case 'cart-close': S.cartOpen=false; renderCart(); updateCartbar(); break;
    case 'open-day': openDay(); break;
    case 'signin': doSignIn(); break;
    case 'signout': if(S.auth) S.auth.signOut(); break;
    case 'logout':
      if(S.pending>0){toast('Wait until it says saved, then log out.');break;}
      if(S.auth){closeModal();S.auth.signOut();toast('Logged out');}
      break;
    case 'new-product': openProduct(null); break;
    case 'edit-product': openProduct(id); break;
    case 'settings': openSettings(); break;
    case 'stock-filter': S.sf=t.dataset.f; updateStock(); break;
    case 'report-view': S.rv=t.dataset.v; refresh(); break;
    case 'copy-stock': copyText(stockText(shopName(),S.products,Date.now())); break;
    case 'export-stock-xlsx': exportStockXlsx(); break;
    case 'export-stock-pdf': exportStockPdf(); break;
    case 'pdf-receipt': downloadReceiptPdf(S.rc); break;
    case 'sell-cat': S.cat=t.dataset.c; renderGrid(); break;
    case 'prod-cat': S.pcat=t.dataset.c; updateProducts(); break;
    case 'copy-report': copyText(reportText(shopName(),Object.assign(dayDoc(parseMoney(S.counted)),{}))); break;
    case 'today-xlsx': if(dayOpen()) exportDayXlsx(dayDoc(parseMoney(S.counted))); break;
    case 'today-pdf': if(dayOpen()) exportDayPdf(dayDoc(parseMoney(S.counted))); break;
    case 'day-xlsx': var dx=S.days.find(function(x){return x.id===id;}); if(dx) exportDayXlsx(dx); break;
    case 'day-pdf': var dp=S.days.find(function(x){return x.id===id;}); if(dp) exportDayPdf(dp); break;
    case 'copy-day': var d=S.days.find(function(x){return x.id===id;}); if(d) copyText(reportText(shopName(),d)); break;
    case 'close-ask': S.closeAsk=true; updateCloseBox(); break;
    case 'close-cancel': S.closeAsk=false; updateCloseBox(); break;
    case 'close-confirm': closeDay(); break;
    case 'void-ask': S.voidAsk=id; updateReport(); break;
    case 'void-cancel': S.voidAsk=null; updateReport(); break;
    case 'void-confirm': voidSale(id); break;
    case 'show-receipt': var s=S.sales.find(function(x){return x.id===id;}); if(s) showReceipt(s,false); break;
  }

function onModal(m){
  var a=m.dataset.m;
  if(a==='close') return closeModal();
  if(a==='signout'){closeModal();if(S.auth)S.auth.signOut();return;}
  if(a==='pick'){var f=$('#ed-file'); if(f) f.click(); return;}
  if(a==='dl-day-xlsx'){exportDayXlsx(S.lastDay);return;}
  if(a==='dl-day-pdf'){exportDayPdf(S.lastDay);return;}
  if(a==='cat'){var ci=$('#ed-cat'); if(ci){ci.value=m.dataset.c; paintCatPick();} return;}
  if(a==='addstock'){var si=$('#ed-stock'); var cur=parseCount(si.value)||0; si.value=cur+Number(m.dataset.n); return;}
  if(a==='bplus'||a==='bminus'){var BE=S.ed; if(BE&&BE.bundle){var n=(BE.q[m.dataset.id]||0)+(a==='bplus'?1:-1); if(n<=0) delete BE.q[m.dataset.id]; else BE.q[m.dataset.id]=Math.min(n,99); paintBundleList(); paintBundleSum();} return;}
  if(a==='bsave') return saveBundle();
  if(a==='bdel') return deleteBundle();
  if(a==='save') return saveProduct();
  if(a==='del') return deleteProduct();
  if(a==='save-settings') return saveSettings();
  if(a==='rmqr'){S.ed.qrFile=null;S.ed.removeQr=true;S.ed.preview='';paintPhotoBox();m.remove();return;}
  if(a==='copy-receipt'&&S.rc) return copyText(receiptText(shopName(),S.rc));
}

  else if(id==='be-price'){paintBundleSum();}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&M.firstChild) closeModal();
  if(e.key==='Enter'&&e.target.id==='tender'){var b=$('#complete'); if(b&&!b.disabled) completeSale();}
  if(e.key==='Enter'&&(e.target.id==='ot-float'||e.target.id==='ot-name')) openDay();
  if(e.key==='Enter'&&(e.target.id==='si-email'||e.target.id==='si-pass')) doSignIn();
});
document.addEventListener('toggle',function(e){
  var d=e.target; if(d&&d.matches&&d.matches('details.day')){ if(d.open) S.openDays.add(d.dataset.id); else S.openDays.delete(d.dataset.id); }
},true);
window.addEventListener('resize',fitChrome);

/* ---------- shell ---------- */
$('#tabs').innerHTML=TABS.map(function(t){return '<button class="tab" role="tab" data-act="tab" data-tab="'+t[0]+'" aria-selected="false">'+ICON[t[2]]+'<span>'+t[1]+'</span></button>';}).join('');
$('#gear').innerHTML=ICON.gear;
$('#logout').innerHTML='<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>';

/* ---------- data ---------- */
function note(snap){
  if(snap.metadata&&!snap.metadata.fromCache){S.confirmed=true;S.slow=false;}
}
function onErr(e){if(e&&e.code==='permission-denied')S.denied=true;else S.slow=true;refresh();}
function listen(ref,next,err){var u=ref.onSnapshot(next,err);S.unsubs.push(u);return u;}
function subSales(){
  if(S.unsubSales){S.unsubSales();S.unsubSales=null;}
  var id=dayOpen()?S.meta.dayId:null;
  S.salesFor=id; S.sales=[];
  if(!id) return;
  S.unsubSales=S.db.collection('sales').where('dayId','==',id).onSnapshot(function(snap){
    S.sales=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());}).sort(function(a,b){return b.ts-a.ts;});
    refresh();
  },onErr);
}
function subscribe(){
  var db=S.db;
  listen(db.doc('meta/shop'),function(snap){S.shop=snap.exists?Object.assign({},snap.data()):{};note(snap);refresh();},onErr);
  db.doc('meta/bundles').onSnapshot(function(snap){
    var d=snap.exists?snap.data():null; S.bundles=d&&Array.isArray(d.list)?d.list:[]; note(snap); pruneCart(); refresh();
  },onErr);
  listen(db.doc('meta/day'),function(snap){
    S.meta=snap.exists?Object.assign({},snap.data()):null; S.got.meta=true; note(snap);
    var want=dayOpen()?S.meta.dayId:null;
    if(want!==S.salesFor) subSales();
    refresh();
  },onErr);
  listen(db.collection('products'),function(snap){
    S.products=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
    S.got.products=true; note(snap);
    pruneCart();
    refresh();
  },onErr);
  listen(db.collection('days').orderBy('closedAt','desc').limit(60),function(snap){
    S.days=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
    note(snap); refresh();
  },onErr);
  setTimeout(function(){if(!S.confirmed){S.slow=true;refresh();}},10000);
}
function signinHTML(){
  return '<section class="gate card"><h2>Sign in</h2><p class="lede">Use the username and password you created for NSA POS 2026.</p>'+
    '<div class="field"><label for="si-email">Username</label><input id="si-email" class="text" type="text" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false"></div>'+
    '<div class="field"><label for="si-pass">Password</label><input id="si-pass" class="text" type="password" autocomplete="current-password"></div>'+
    '<p class="err" id="si-err" role="alert"></p><button class="cta" data-act="signin">Sign in</button></section>';
}
function authError(e){
  var c=(e&&e.code)||'';
  if(c==='auth/invalid-credential'||c==='auth/wrong-password'||c==='auth/user-not-found'||c==='auth/invalid-login-credentials') return 'That username and password do not match. Check them and try again.';
  if(c==='auth/invalid-email') return 'That username does not look right. Use letters and numbers only.';
  if(c==='auth/too-many-requests') return 'Too many attempts. Wait a few minutes and try again.';
  if(c==='auth/network-request-failed') return 'No internet connection. Connect and try again.';
  if(c==='auth/operation-not-allowed') return 'Email sign-in is switched off in your Firebase project. Turn on Email/Password under Authentication.';
  return 'Could not sign in ('+(c||'unknown error')+').';
}
function doSignIn(){
  var em=$('#si-email'), pw=$('#si-pass'), err=$('#si-err'), btn=$('[data-act="signin"]');
  if(!em||!pw||!S.auth) return;
  var email=em.value.trim().toLowerCase(), pass=pw.value;
  if(!email||!pass){err.textContent='Enter your username and password.';return;}
  if(email.indexOf('@')<0) email=email.replace(/\s+/g,'')+'@nsapos.app';
  err.textContent=''; btn.disabled=true; btn.textContent='Signing in…';
  S.auth.signInWithEmailAndPassword(email,pass).catch(function(e){
    err.textContent=authError(e); btn.disabled=false; btn.textContent='Sign in';
  });
}
function resetData(){
  S.unsubs.forEach(function(u){try{u();}catch(e){}}); S.unsubs=[];
  if(S.unsubSales){try{S.unsubSales();}catch(e){} S.unsubSales=null;}
  S.salesFor=undefined; S.got={meta:false,products:false}; S.meta=null; S.shop={}; S.products=[]; S.sales=[]; S.days=[];
  S.cart={}; S.tender=''; S.confirmed=false; S.slow=false; S.denied=false; S.closeAsk=false; S.voidAsk=null; S.key=null; S.gridSig=''; S.cartSig='';
}
var STAFF_USERS=['nsa@nsapos.app'];
function initFirebase(){
  var cfg=window.FIREBASE_CONFIG;
  if(!cfg||!cfg.apiKey||/PASTE|YOUR/i.test(String(cfg.apiKey))){S.noconfig=true;return;}
  if(typeof firebase==='undefined'){S.nodb=true;return;}
  firebase.initializeApp(cfg);
  S.auth=firebase.auth(); S.db=firebase.firestore();
  try{ S.db.enablePersistence({synchronizeTabs:true}).then(function(){S.persist=true;refresh();},function(){S.persist=false;}); }catch(e){}
  S.auth.onAuthStateChanged(function(u){
    S.authReady=true;
    S.staff=!!u&&STAFF_USERS.indexOf(String(u.email||'').toLowerCase())>=0;
    if(S.staff&&S.tab==='products') S.tab='sell';
    if(u){S.user=u; if(!S.unsubs.length) subscribe();}
    else{S.user=null; resetData();}
    refresh();
  });
}
window.addEventListener('offline',function(){S.offline=true;updateChrome();});
window.addEventListener('online',function(){S.offline=false;updateChrome();});
S.offline=(typeof navigator!=='undefined'&&navigator.onLine===false);
var RCPT=parseReceiptHash(location.hash);
if(RCPT){renderPublicReceipt(RCPT);}
else{initFirebase();refresh();}
if(window.ResizeObserver) new ResizeObserver(fitChrome).observe($('#chrome'));
})();
</script>
